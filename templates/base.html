<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="Jo5ZPZf4bUss9WIOTADZ0srorBH66BxSnc6Z-Vl8klg">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="VELORA Motors — premium online luxury car shop.">

    <title>{% block title %}VELORA MOTORS — Luxury Cars{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="header">
    <a href="{{ url_for('index') }}" class="logo">
        VELORA <small>MOTORS</small>
    </a>

    <button class="menu-btn" aria-label="Open navigation">☰</button>

    <nav class="nav">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('shop') }}">Shop</a>
        <a href="{{ url_for('shop') }}?type=Supercar">Supercars</a>
        <a href="{{ url_for('shop') }}?type=Performance">Performance</a>
    </nav>

    <a href="{{ url_for('cart') }}" class="cart-link">
        Cart <b id="cart-count">{{ cart_count }}</b>
    </a>
</header>

{% if page_error %}
<div class="error-banner">{{ page_error }}</div>
{% endif %}

<main>
    {% block content %}{% endblock %}
</main>

<footer class="footer">

    <div class="footer-brand">
        VELORA <small>MOTORS</small>
        <p>Luxury cars. Direct purchase.</p>
    </div>

    <div class="footer-links">
        <a href="{{ url_for('shop') }}">Shop Cars</a>
        <a href="{{ url_for('cart') }}">Cart</a>
        <a href="{{ url_for('checkout') }}">Checkout</a>
    </div>

    <div class="footer-note">
        Demo e-commerce project · 2026
    </div>

</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
